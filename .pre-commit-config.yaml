# Pre-commit hooks: run Black and Ruff on staged Python files before every commit,
# so formatting/lint issues are fixed locally instead of failing in CI.
#
# One-time setup after cloning:
#     poetry run pre-commit install
#
# Scope and versions match the CI lint job (black --check + ruff check on
# src/chronovista/ and tests/). When Black or Ruff are bumped in pyproject.toml,
# bump the `rev` values here to match (or run `pre-commit autoupdate`).

repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        files: ^(src/chronovista/|tests/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(src/chronovista/|tests/)

  # Blocks names from the local library entering the repository. Reads
  # .private-terms (gitignored, generated by gen_private_terms.py) and checks
  # only the lines a commit ADDS — the repository already contains ~1,000 such
  # occurrences in older tests and changelogs, and a whole-file check would
  # block every commit touching them.
  #
  # Warns and passes when the term list is absent, so a fresh clone is not
  # bricked. Run gen_private_terms.py after adding entities.
  - repo: local
    hooks:
      - id: private-terms
        name: no library names in staged changes
        entry: python scripts/utilities/check_private_terms.py
        language: system
        pass_filenames: false
        always_run: true
      - id: private-terms-msg
        name: no library names in the commit message
        entry: python scripts/utilities/check_private_terms.py --msg
        language: system
        stages: [commit-msg]
