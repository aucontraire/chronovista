services:
  postgres-dev:
    image: postgres:15-alpine
    container_name: chronovista-postgres-dev
    environment:
      POSTGRES_DB: chronovista_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5434:5432"
    # Persistent storage for PostgreSQL data
    # Data survives container restarts and Docker Desktop updates
    # Add some optimizations for development (not production!)
    command: >
      postgres
      -c shared_preload_libraries=''
      -c max_connections=200
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
      -c temp_file_limit=100MB
      -c log_min_duration_statement=0
      -c log_statement=all
      -c log_min_messages=warning
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    volumes:
      - chronovista-pgdata:/var/lib/postgresql/data
      # Mount init scripts if needed
      - ./scripts/init-dev-db.sql:/docker-entrypoint-initdb.d/init-dev-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d chronovista_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chronovista-dev

  # Optional: pgAdmin for database inspection during development
  pgadmin-dev:
    image: dpage/pgadmin4:latest
    container_name: chronovista-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@example.com
      PGADMIN_DEFAULT_PASSWORD: dev_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "8081:80"
    depends_on:
      postgres-dev:
        condition: service_healthy
    volumes:
      - ./scripts/pgadmin-servers.json:/pgadmin4/servers.json:ro
    networks:
      - chronovista-dev
    profiles:
      - admin  # Only start with: docker-compose --profile admin up

  # Optional: Neo4j for the dev-scoped connection explorer (Feature 112).
  # Dev-only — never part of the shipped stack (docker-compose.yml).
  # Start with: docker compose -f docker-compose.dev.yml --profile graph up -d neo4j-dev
  # Load with:  scripts/graph/reload_all.sh   (reads prod Postgres, writes this container)
  neo4j-dev:
    image: neo4j:5.26-community
    container_name: chronovista-neo4j-dev
    environment:
      NEO4J_AUTH: neo4j/dev_password
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7475:7474"   # HTTP browser (host 7475 — 7474 is taken by another project's Neo4j)
      - "7688:7687"   # Bolt        (host 7688 — 7687 is taken by another project's Neo4j)
    volumes:
      - chronovista-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chronovista-dev
    profiles:
      - graph  # Only start with: docker compose --profile graph up

networks:
  chronovista-dev:
    driver: bridge

volumes:
  chronovista-pgdata:
    driver: local
  chronovista-neo4j-data:
    driver: local
