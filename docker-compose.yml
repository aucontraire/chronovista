services:
  postgres:
    image: postgres:15-alpine
    container_name: chronovista-postgres
    # Default Docker /dev/shm is 64MB; parallel queries overflow it and fail with
    # "could not resize shared memory segment ... No space left on device". Raise it.
    shm_size: "1gb"
    environment:
      POSTGRES_DB: chronovista
      POSTGRES_USER: ${DB_USER:-chronovista}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chronovista}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5435:5432"
    volumes:
      - chronovista-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chronovista} -d chronovista"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chronovista
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    container_name: chronovista-neo4j
    # NO published host ports — bolt (7687) and the 7474 admin console stay on the
    # internal network only (FR-019). The app reaches it at bolt://neo4j:7687; operators
    # use `docker compose exec neo4j cypher-shell`. 7474 is an interactive read/write
    # Cypher console over the whole library graph, NOT a wire protocol — never publish it.
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-chronovista_graph}
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      # Distinct from the dev stack's `chronovista-neo4j-data` (docker-compose.dev.yml
      # neo4j-dev) — both compose files share project `chronovista`, so a shared name
      # would collide into one Docker volume (cross-stack contamination + store lock).
      - chronovista-neo4j-prod-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chronovista
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INCLUDE_NLP: ${INCLUDE_NLP:-false}
    container_name: chronovista-app
    ports:
      - "${APP_PORT:-8765}:8765"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-chronovista}:${DB_PASSWORD:-chronovista}@postgres:5432/chronovista
      DEVELOPMENT_MODE: "false"
      SERVE_STATIC: "true"
      DATA_DIR: /data
      TAKEOUT_DIR: /data/takeout
      # Graph (Feature 112/113) — internal bolt only; the client connects lazily and
      # degrades gracefully when the graph is unavailable, so this is not a hard dependency.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      # Keep this explicit: settings aliases neo4j_password to NEO4J_PWD too, and the
      # gitignored .env (loaded via env_file) may carry NEO4J_PWD=<dev value>. The explicit
      # NEO4J_PASSWORD here wins and matches the neo4j container's NEO4J_AUTH; dropping it
      # would let the .env dev password leak in and fail auth.
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-chronovista_graph}
      # Graph loader (scripts/graph/reload_all.sh, via `make graph-reload`). The loader's
      # native-dev defaults target localhost:5435 and need an explicit internal-host opt-in for the
      # write-guard; set them here so the reload runs inside the container with no env of its own.
      CHRONO_GRAPH_INTERNAL_HOST: neo4j
      CHRONO_PGHOST: postgres
      CHRONO_PGPORT: "5432"
      CHRONO_PGUSER: ${DB_USER:-chronovista}
      CHRONO_PGDB: chronovista
      CHRONO_PGPASSWORD: ${DB_PASSWORD:-chronovista}
    volumes:
      - ./data:/data
      - ./takeout:/data/takeout:ro
      - ./cache:/app/cache
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        # service_started, not service_healthy: the graph is lazy + degrades gracefully,
        # so the app must not block startup on the graph being ready (Principle VIII).
        condition: service_started
    networks:
      - chronovista
    restart: unless-stopped

networks:
  chronovista:
    driver: bridge

volumes:
  chronovista-data:
    driver: local
  chronovista-neo4j-prod-data:
    driver: local
