name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction

      # `-o addopts=...` replaces pytest.ini's addopts wholesale, so --cov has to
      # be passed explicitly here rather than inherited from config.
      - name: Run unit tests
        env:
          COVERAGE_FILE: .coverage.unit
        run: NO_COLOR=1 poetry run pytest tests/unit/ -x -q -o "addopts=-v --strict-markers --strict-config" -m "not db" --cov=chronovista --cov-report=

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          retention-days: 1

  mypy:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run ruff
        run: poetry run ruff check src/chronovista/ tests/

      - name: Run black
        run: poetry run black --check src/chronovista/ tests/

      - name: Run mypy
        run: poetry run mypy src/chronovista/ --strict --no-error-summary

  frontend:
    name: Frontend Tests & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run --reporter=verbose

  integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: dev_user
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: chronovista_integration_test
        ports:
          - 5434:5432
        # `-d` matters only for the logs, and that is reason enough. Without it
        # pg_isready connects to a database named after the user, which does not
        # exist, so the server logs `FATAL: database "dev_user" does not exist`
        # every interval for the life of the job.
        #
        # It is not a stronger check: pg_isready exits 0 whenever the *server*
        # responds, and a missing database is still a response — verified,
        # `pg_isready -d no_such_db` also exits 0. So this changes nothing about
        # what is detected. What it removes is a recurring FATAL that reads
        # exactly like a real connection failure, which is the kind of noise
        # that gets a genuine startup problem dismissed.
        options: >-
          --health-cmd="pg_isready -U dev_user -d chronovista_integration_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_INTEGRATION_URL: postgresql+asyncpg://dev_user:dev_password@localhost:5434/chronovista_integration_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-

      - name: Install dependencies
        # `--with database` pulls in psycopg2-binary (optional group). Alembic's
        # env.py converts the async URL to a sync one, so the migration step
        # below needs a sync driver; the app itself only ever uses asyncpg.
        run: poetry install --no-interaction --with database

      - name: Verify Alembic migrations apply cleanly (FR-024)
        env:
          DATABASE_URL: postgresql+asyncpg://dev_user:dev_password@localhost:5434/chronovista_integration_test
        run: NO_COLOR=1 poetry run alembic upgrade head

      # Fails if the ORM models and the migrated schema have drifted — i.e. if a
      # model changed without a migration, or a migration created something the
      # models do not declare. The step above proves the migrations *run*; this
      # one proves they produce the schema the application actually expects.
      - name: Verify no model/migration drift (alembic check)
        env:
          DATABASE_URL: postgresql+asyncpg://dev_user:dev_password@localhost:5434/chronovista_integration_test
        run: NO_COLOR=1 poetry run alembic check

      - name: Run integration tests
        env:
          COVERAGE_FILE: .coverage.integration
        run: NO_COLOR=1 poetry run pytest tests/integration/ -q -o "addopts=-v --strict-markers --strict-config" -m "not docker and not slow and not auth and not db" --cov=chronovista --cov-report=

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          retention-days: 1

  # Coverage is gated on the *combined* unit + integration figure, not on either
  # job alone. Gating the unit job by itself would mark code that is legitimately
  # covered at the seam as uncovered, and the way to satisfy that gate is to
  # write mock-heavy unit tests for things integration tests already exercise
  # for real — the exact trade this project decided against.
  #
  # The threshold is a ratchet at roughly the current figure, not an aspiration.
  # Raise it when coverage rises; never lower it to make a red build green.
  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-tests, integration-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      # Both jobs check out to the same path on the same runner image, so the
      # absolute file paths recorded in the two data files line up and combine
      # needs no --relative remapping.
      - name: Combine and report
        run: |
          poetry run coverage combine .coverage.unit .coverage.integration
          poetry run coverage report --precision=2 --fail-under=76